<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBD Defender</title>
  <meta name="description" content="Landing page interaktif DBD Defender untuk anak-anak: laboratorium nyamuk, ujian agen, buku saku, dan tentang." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <main class="home" id="home">
      <section class="hero" aria-label="Sambutan DBD Defender">
        <img src="assets/hero.png" alt="Banner DBD Defender" class="hero__image" />
      </section>

      <section class="menu-area" aria-label="Menu utama">
        <div class="menu-grid">
          <button class="menu-card" type="button" data-menu="lab" aria-label="Buka Laboratorium Nyamuk">
            <img src="assets/menu-lab.png" alt="Laboratorium Nyamuk" />
          </button>

          <button class="menu-card" type="button" data-menu="quiz" aria-label="Buka Ujian Agen">
            <img src="assets/menu-quiz.png" alt="Ujian Agen" />
          </button>

          <button class="menu-card" type="button" data-menu="book" aria-label="Buka Buku Saku">
            <img src="assets/menu-book.png" alt="Buku Saku" />
          </button>

          <button class="menu-card" type="button" data-menu="about" aria-label="Buka Tentang">
            <img src="assets/menu-about.png" alt="Tentang" />
          </button>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" data-close-modal aria-label="Tutup popup">
        <img src="assets/close.png" alt="" aria-hidden="true" />
      </button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
